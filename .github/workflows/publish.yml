name: Publish Versioned Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version (MAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH, e.g. 1.0.0 or v1.0.0)'
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  # 0.4.2 与 v0.4.2 是同一次发布。分组必须用规范化 tag，否则两条 workflow
  # 会同时进入 desktop.yml，而那边的 cancel-in-progress 会取消另一边的构建。
  group: publish-${{ startsWith(inputs.tag, 'v') && inputs.tag || format('v{0}', inputs.tag) }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.normalize.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Normalize release tag
        id: normalize
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          tag=$(node -p "require('./scripts/release-version.cjs').normalizeReleaseTag(process.env.RAW_TAG)")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Validate release version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.normalize.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/publish-release.cjs --check

  build:
    needs: prepare
    uses: ./.github/workflows/desktop.yml
    with:
      release_version: ${{ needs.prepare.outputs.release_tag }}

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download versioned builds from this run
        uses: actions/download-artifact@v4
        with:
          pattern: RHINE-MUSIC-DATABASE-*
          path: artifacts
      - name: Collect exact release packages
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir release
          for platform in $(node -p "require('./scripts/release-version.cjs').distributionPlatforms.join(' ')"); do
            name="RhineMusicDatabase-${RELEASE_TAG}-${platform}"
            mapfile -t files < <(find artifacts -type f -name "$name")
            [[ "${#files[@]}" -eq 1 ]] || { echo "Missing or ambiguous package: $name"; exit 1; }
            cp "${files[0]}" "release/$name"
          done
          chmod 0755 release/*.AppImage
          node scripts/create-update-feed.cjs release "$RELEASE_TAG"
      # 使用创建时返回的 Release ID，避免未发布草稿按 tag 查询时返回 404。
      - name: Upload, verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/publish-release.cjs
